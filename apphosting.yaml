# Settings to manage and configure a Firebase App Hosting backend for Coaster.
# https://firebase.google.com/docs/app-hosting/configure

env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyAnvxRnS86VIkc9otvuh4Vg42g25AJnfd4"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "coaster-tally-2026.firebaseapp.com"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "coaster-tally-2026"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "coaster-tally-2026.firebasestorage.app"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "250751511013"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:250751511013:web:046144a8ddc753664ae70c"
    availability:
      - BUILD
      - RUNTIME
  # Canonical base URL for share links, 1-tap Coaster email actions, and OG metadata.
  - variable: NEXT_PUBLIC_SITE_URL
    value: "https://coaster--coaster-tally-2026.us-central1.hosted.app"
    availability:
      - BUILD
      - RUNTIME

  # Server-side Genkit / Gemini API key (Secret Manager)
  - variable: GOOGLE_GENAI_API_KEY
    secret: GOOGLE_GENAI_API_KEY
    availability:
      - BUILD
      - RUNTIME

  # Scheduled morning & evening briefing auth + HMAC action token signing (Secret Manager)
  - variable: CRON_SECRET
    secret: CRON_SECRET
    availability:
      - RUNTIME

  # 2-way Gmail Companion (+coaster@) transport
  - variable: GMAIL_USER
    value: "nicholas.switzer@gmail.com"
    availability:
      - RUNTIME
  - variable: GMAIL_APP_PASSWORD
    secret: GMAIL_APP_PASSWORD
    availability:
      - RUNTIME

runConfig:
  minInstances: 0
  maxInstances: 3
  cpu: 1
  memoryMiB: 512
  concurrency: 80
